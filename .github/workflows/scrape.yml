name: Scrape Google Maps

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search query (e.g. restaurants in Dhaka)'
        required: true
        type: string
      location:
        description: 'Location (e.g. Dhaka, Bangladesh)'
        required: true
        type: string
        default: 'Dhaka, Bangladesh'
      keywords:
        description: 'Extra keywords to filter results (comma-separated, optional)'
        required: false
        type: string
        default: ''
      collect_website:
        description: 'Collect Website data'
        required: false
        type: boolean
        default: true
      collect_phone:
        description: 'Collect Phone data'
        required: false
        type: boolean
        default: true
      collect_facebook:
        description: 'Collect Facebook data (via website lookup)'
        required: false
        type: boolean
        default: true
      collect_address:
        description: 'Collect Address data'
        required: false
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: |
          node scrape-maps.js \
            "${{ github.event.inputs.query }}" \
            "${{ github.event.inputs.location }}" \
            "${{ github.event.inputs.keywords }}" \
            "${{ github.event.inputs.collect_website }}" \
            "${{ github.event.inputs.collect_phone }}" \
            "${{ github.event.inputs.collect_facebook }}" \
            "${{ github.event.inputs.collect_address }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
